<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
  :root {
    --legno-1:#3b2416; --legno-2:#2e1b10; --legno-3:#4a2e1c;
    --carta:#f3e2bf; --carta-scura:#d9bf8c; --inchiostro:#3a220f;
    --rosso:#b3261e; --oro:#e0a93b;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { color-scheme: dark; }
  html { background:var(--legno-2); }
  body {
    margin:0; min-height:100vh; color:var(--carta);
    font-family:"Special Elite", "Courier New", monospace;
    padding-block: 14px 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    /* assi di legno */
    background:
      radial-gradient(ellipse at top, rgba(255,190,110,.18), transparent 60%),
      repeating-linear-gradient(90deg, rgba(0,0,0,.35) 0 2px, transparent 2px 25%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 7px),
      linear-gradient(90deg, var(--legno-1), var(--legno-3) 30%, var(--legno-1) 55%, var(--legno-3) 80%, var(--legno-1));
  }

  /* Filigrana: foto ripetuta in piccolo dietro a tutto */
  #filigrana {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background: url("immagini/filigrana.png") repeat; background-size: 190px 190px;
    opacity:.28;
  }
  .manifesto, #sceriffo, #griglia, #installa { position:relative; z-index:1; }

  /* Manifesto "Wanted" in alto */
  .manifesto {
    position:relative; max-width:520px; margin:6px auto 18px; padding:14px 16px 12px;
    text-align:center; color:var(--inchiostro);
    background:
      radial-gradient(circle at 20% 30%, rgba(120,70,20,.12), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(120,70,20,.15), transparent 45%),
      linear-gradient(var(--carta), var(--carta-scura));
    border-radius:4px;
    box-shadow: 0 10px 24px rgba(0,0,0,.55), inset 0 0 28px rgba(110,60,15,.35);
    transform: rotate(-1deg);
  }
  .manifesto::before, .manifesto::after {      /* chiodi */
    content:""; position:absolute; top:8px; width:10px; height:10px; border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #ddd, #555 70%);
    box-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .manifesto::before { left:10px; } .manifesto::after { right:10px; }
  .sopra { font-size:.8rem; letter-spacing:.35em; opacity:.75; }
  h1 {
    font-family:"Rye", Georgia, serif; font-weight:400; margin:2px 0 0;
    font-size: clamp(1.9rem, 9vw, 2.8rem); line-height:1.05; color:var(--rosso);
    text-shadow: 1px 1px 0 rgba(0,0,0,.15);
  }
  .sotto { font-size:.85rem; margin-top:4px; }
  .sotto::before, .sotto::after { content:"★"; color:var(--rosso); margin:0 .5em; }

  #griglia {
    max-width:720px; margin:0 auto;
    display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:12px;
  }
  .tasto {
    position:relative; border:0; padding:0; background:#fff; border-radius:10px;
    overflow:hidden; aspect-ratio:0.65; cursor:pointer;
    box-shadow: 0 6px 12px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.08) inset;
    transition: transform .12s ease, box-shadow .12s ease;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
    animation: entra .4s ease backwards;
  }
  .tasto:nth-child(odd)  { --r: -1.2deg; }
  .tasto:nth-child(even) { --r:  1.2deg; }
  .tasto { transform: rotate(var(--r)); }
  .tasto img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .tasto span { display:none; }
  .tasto:active { transform: rotate(0) scale(.93); box-shadow:0 2px 5px rgba(0,0,0,.6); }
  .tasto.suona {
    transform: rotate(0) scale(1.04); z-index:1;
    box-shadow: 0 0 0 3px var(--oro), 0 0 22px 6px rgba(224,169,59,.65), 0 8px 16px rgba(0,0,0,.6);
  }
  .tasto.suona::after {                       /* lampo di sparo */
    content:""; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(circle, rgba(255,230,160,.55), transparent 65%);
    animation: lampo .35s ease-out forwards;
  }
  @keyframes lampo { from { opacity:1; } to { opacity:0; } }
  @keyframes entra { from { opacity:0; transform: translateY(14px) rotate(var(--r)); } }

  /* Stop: stella da sceriffo fissa in basso */
  #stop {
    position:fixed; right:16px; bottom: calc(env(safe-area-inset-bottom) + 16px); z-index:5;
    width:68px; height:68px; border:0; padding:0; background:none; cursor:pointer;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,.6));
    transition: transform .12s ease;
  }
  #stop:active { transform: scale(.9) rotate(-10deg); }
  #stop svg { width:100%; height:100%; display:block; }
  #stop b {
    position:absolute; inset:0; display:grid; place-items:center;
    font-family:"Rye", Georgia, serif; font-weight:400; font-size:.8rem; color:var(--inchiostro);
  }

  #installa {
    max-width:520px; margin:26px auto 70px; font-size:.85rem; line-height:1.45; text-align:center;
    color:var(--carta); opacity:.8;
  }
  #installa:empty { display:none; }
  @media (prefers-reduced-motion: reduce) { .tasto { animation:none; } }
  .fx { position:absolute; pointer-events:none; z-index:40; }
  .fx-dentro { overflow:hidden; border-radius:16px; }

  /* La carta in primo piano */
  .palco {
    position:fixed; inset:0; z-index:30; display:grid; place-items:center;
    background: radial-gradient(circle at 50% 50%, rgba(255,190,110,.28), rgba(15,8,3,.9) 62%);
    -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
    cursor:pointer;
  }
  .carta-grande {
    position:relative; border-radius:16px; overflow:hidden; background:#fff;
    box-shadow: 0 0 0 3px rgba(224,169,59,.9), 0 0 50px 10px rgba(224,169,59,.35), 0 30px 60px rgba(0,0,0,.7);
    will-change: transform;
  }
  .carta-grande img { width:100%; height:100%; object-fit:cover; display:block; }
  /* Pulsante SPARA ALLO SCERIFFO */
  #sceriffo {
    display:flex; align-items:center; justify-content:center; gap:12px;
    width:100%; max-width:520px; margin:0 auto 20px; padding:16px 18px; cursor:pointer;
    font-family:"Rye", Georgia, serif; font-size: clamp(1.25rem, 6vw, 1.7rem); line-height:1.1; color:#fff3c4;
    text-shadow: 0 2px 0 #5c1410;
    background: radial-gradient(circle at 50% 30%, #e0473c, #a51d15 60%, #7a120c);
    border: 3px solid #5c1410; border-radius:16px;
    box-shadow: 0 7px 0 #4a0e09, 0 14px 24px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.25);
    transition: transform .08s ease, box-shadow .08s ease;
    animation: invito 1.6s ease-in-out infinite;
    touch-action:manipulation; -webkit-user-select:none; user-select:none;
  }
  #sceriffo svg { width:44px; height:44px; flex:none; filter: drop-shadow(0 2px 2px rgba(0,0,0,.5)); }
  #sceriffo:active { transform: translateY(6px); box-shadow: 0 1px 0 #4a0e09, 0 4px 10px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.25); animation:none; }
  @keyframes invito { 50% { transform: scale(1.03); } }

  .sparatoria { position:fixed; inset:0; z-index:60; overflow:hidden; cursor:pointer; }
  .sparatoria .scena { position:absolute; inset:0; display:grid; place-items:center; }
  .stella-sceriffo { position:absolute; width:min(72vw, 48vh); aspect-ratio:1; filter: drop-shadow(0 12px 20px rgba(0,0,0,.7)); }
  .stella-sceriffo .buco { position:absolute; width:22%; aspect-ratio:1; translate:-50% -50%; }
  .crepa-schermo { position:absolute; width:min(40vw, 260px); aspect-ratio:1; pointer-events:none; }
  .scintilla-s { position:absolute; left:50%; top:50%; width:10px; height:10px; border-radius:50%; box-shadow:0 0 10px #ffb347; }
  .testo-sceriffo {
    position:absolute; text-align:center; font-family:"Rye", Georgia, serif; line-height:.95;
    font-size: min(17vw, 120px); color:#ffde59;
    -webkit-text-stroke: 3px #5c1410; paint-order: stroke fill;
    text-shadow: 0 6px 0 #5c1410, 0 0 40px rgba(255,120,40,.8);
  }

  /* Pulsante PEPPE BRESCIA */
  #peppe {
    display:flex; align-items:center; justify-content:center; gap:14px;
    width:100%; max-width:520px; margin:-6px auto 22px; padding:10px 16px; cursor:pointer;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif; font-weight:800;
    font-size: clamp(1.3rem, 6.5vw, 1.8rem); color:#fff; letter-spacing:.01em;
    text-shadow: 0 2px 0 #9a3b00, 0 0 10px rgba(255,255,255,.4);
    background: linear-gradient(135deg, #ff9800, #ff5722 55%, #ff9800);
    border:3px solid #9a3b00; border-radius:999px;
    box-shadow: 0 7px 0 #7a2e00, 0 14px 24px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.35);
    transition: transform .08s ease, box-shadow .08s ease;
    animation: dondola 2.4s ease-in-out infinite;
    touch-action:manipulation; -webkit-user-select:none; user-select:none; position:relative; z-index:1;
  }
  #peppe img { width:52px; height:52px; border-radius:50%; object-fit:cover; border:3px solid #fff; flex:none;
    box-shadow:0 2px 6px rgba(0,0,0,.4); animation: saluta 1.2s ease-in-out infinite; }
  #peppe:active { transform: translateY(6px); box-shadow: 0 1px 0 #7a2e00, 0 4px 10px rgba(0,0,0,.5); animation:none; }
  @keyframes dondola { 0%,100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
  @keyframes saluta { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg) scale(1.08); } }

  .peppe-show {
    position:fixed; inset:0; z-index:60; overflow:hidden; cursor:pointer;
    background: conic-gradient(from 0deg, #ff3d00, #ffd600, #76ff03, #00e5ff, #ff00c8, #ff3d00);
    animation: arcobaleno 1.2s linear infinite;
  }
  @keyframes arcobaleno { to { filter: hue-rotate(360deg); } }
  .peppe-grande { position:absolute; filter: drop-shadow(0 18px 30px rgba(0,0,0,.5)); }
  .peppe-mini { position:absolute; filter: drop-shadow(0 4px 8px rgba(0,0,0,.4)); }
  .peppe-scritta { position:absolute; font-family:"Rye", Georgia, serif; white-space:nowrap;
    -webkit-text-stroke: 2px #000; paint-order: stroke fill; text-shadow: 0 4px 0 #000; }

  .suggerimento { position:absolute; left:0; right:0; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    text-align:center; font-size:.8rem; color:var(--carta); opacity:.6; }
  .fx-pezzo { position:absolute; }

  /* ====== Layout a pagina unica: tutto in una schermata, niente scorrimento ====== */
  html, body { height:100%; overflow:hidden; overscroll-behavior:none; }
  body {
    min-height:0; height:100%; display:flex; flex-direction:column; gap:10px;
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .testata { position:relative; z-index:2; display:flex; align-items:center; gap:10px; width:100%; max-width:760px; margin:0 auto; flex:none; }
  .manifesto { flex:1; min-width:0; margin:0; padding:8px 12px 7px; max-width:none; }
  .manifesto::before, .manifesto::after { top:6px; width:8px; height:8px; }
  .sopra { font-size:.62rem; }
  h1 { font-size: clamp(1.35rem, 6.6vw, 2.3rem); margin:0; }
  .sotto { font-size:.7rem; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #stop { position:relative; right:auto; bottom:auto; width:58px; height:58px; flex:none; }
  .speciali { position:relative; z-index:1; display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:760px; margin:0 auto; flex:none; }
  #sceriffo, #peppe { margin:0; max-width:none; min-width:0; padding:8px 10px; gap:8px; font-size: clamp(.9rem, 4vw, 1.3rem); }
  #sceriffo { border-radius:14px; }
  #sceriffo svg { width:30px; height:30px; }
  #peppe img { width:36px; height:36px; border-width:2px; }
  #griglia {
    flex:1; min-height:0; width:100%; max-width:none; margin:0;
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-content:center;
    padding-inline: var(--margine, 0px);
  }
  .tasto { width: var(--w, 80px); flex:none; }
</style>

<script>
  document.getElementById("titolo").textContent = TITOLO_APP;
  

  // Web Audio: risposta immediata al tocco anche su iPhone
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const ctx = new Ctx();
  // iPhone: suona anche con l'interruttore silenzioso attivo (iOS 17+)
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  const buffer = {};          // audio già decodificati
  const inRiproduzione = new Set();

  async function carica(url) {
    if (!buffer[url]) {
      buffer[url] = fetch(url).then(r => r.arrayBuffer())
        .then(d => new Promise((ok, ko) => ctx.decodeAudioData(d, ok, ko)));
    }
    return buffer[url];
  }

  async function suona(s) {
    const buf = await carica(s.audio);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start();
    inRiproduzione.add(src);
    src.onended = () => inRiproduzione.delete(src);
    return buf.duration;
  }
  function fermaTutto() {
    inRiproduzione.forEach(s => { try { s.stop(); } catch (e) {} });
  }
  document.getElementById("stop").onclick = fermaTutto;

  // Tocchi una carta: vola al centro, suona, fa l'animazione e torna al suo posto
  let palco = null;
  async function apri(s, tasto) {
    if (palco) return;
    if (ctx.state !== "running") ctx.resume();      // va fatto subito al tocco (iPhone)
    if (navigator.vibrate) navigator.vibrate(15);

    const da = tasto.getBoundingClientRect();
    const ov = document.createElement("div");
    ov.className = "palco";
    ov.innerHTML = `<div class="carta-grande"><img alt=""></div>`;
    const grande = ov.querySelector(".carta-grande");
    grande.querySelector("img").src = s.immagine;
    const H = Math.min(innerHeight * 0.72, (innerWidth * 0.8) / 0.65);
    grande.style.width = H * 0.65 + "px";
    grande.style.height = H + "px";
    document.body.appendChild(ov);
    const p = palco = { ov, tasto, grande, chiuso: false };

    const a = grande.getBoundingClientRect();
    const dalTasto = `translate(${da.left + da.width / 2 - (a.left + a.width / 2)}px, ${da.top + da.height / 2 - (a.top + a.height / 2)}px) scale(${da.width / a.width})`;
    palco.dalTasto = () => {
      const d = tasto.getBoundingClientRect(), g = grande.getBoundingClientRect();
      return `translate(${d.left + d.width / 2 - (g.left + g.width / 2)}px, ${d.top + d.height / 2 - (g.top + g.height / 2)}px) scale(${d.width / g.width})`;
    };
    tasto.style.visibility = "hidden";
    ov.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300 });
    ov.addEventListener("click", () => chiudi(true));

    grande.animate([{ transform: dalTasto }, { transform: "scale(1.06)", offset: .75 }, { transform: "none" }],
      { duration: 450, easing: "cubic-bezier(.2,.7,.3,1)" });

    // dopo il volo: animazione + suono, poi rientro automatico
    setTimeout(() => {
      if (palco !== p || p.chiuso) return;
      const inizio = Date.now();
      let fineSuono = 0;                     // ms dall'inizio, noto quando l'audio è caricato
      const durFx = animaCarta(grande, s.effetto);
      // se l'audio è più lungo, l'animazione riparte finché il suono non finisce
      const ripeti = d => {
        p.loop = setTimeout(() => {
          if (palco !== p || p.chiuso) return;
          if (fineSuono - (Date.now() - inizio) > 500) ripeti(animaCarta(grande, s.effetto));
        }, d);
      };
      ripeti(durFx);
      const fine = ms => { clearTimeout(p.timer); p.timer = setTimeout(() => chiudi(false), Math.max(0, ms - (Date.now() - inizio))); };
      fine(Math.max(durFx, 1400) + 300);
      suona(s).then(sec => { fineSuono = sec * 1000; if (fineSuono > durFx) fine(fineSuono + 300); })
              .catch(e => console.warn("audio", e));
    }, 460);
  }

  async function chiudi(fermaSuono) {
    if (!palco || palco.chiuso) return;
    const p = palco;
    p.chiuso = true;
    clearTimeout(p.timer);
    clearTimeout(p.loop);
    if (fermaSuono) fermaTutto();
    document.querySelectorAll(".fx").forEach(f => f.remove());
    p.grande.getAnimations().forEach(x => x.cancel());
    p.ov.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 380, fill: "forwards" });
    p.ov.style.pointerEvents = "none";
    p.grande.animate([{ transform: "none" }, { transform: p.dalTasto() }],
      { duration: 380, easing: "cubic-bezier(.5,0,.75,0)", fill: "forwards" });
    await new Promise(r => setTimeout(r, 390));
    p.tasto.style.visibility = "";
    p.ov.remove();
    if (palco === p) palco = null;
  }

  // Pulsanti speciali: animazione a tutto schermo che si ripete finché c'è audio
  function lanciaShow(crea, audio) {
    if (palco || document.querySelector(".sparatoria, .peppe-show")) return;
    if (ctx.state !== "running") ctx.resume();
    const sp = crea();
    const inizio = Date.now();
    let fineSuono = 0, giro;
    const ripeti = d => { giro = setTimeout(() => {
      if (sp.chiuso()) return;
      if (fineSuono - (Date.now() - inizio) > 800) ripeti(sp.ripeti());
    }, d); };
    ripeti(sp.durata - 300);
    let fine = setTimeout(() => stop(), sp.durata);
    const stop = () => { clearTimeout(fine); clearTimeout(giro); sp.chiudi(); };
    sp.overlay.addEventListener("click", () => { fermaTutto(); stop(); });
    suona({ audio }).then(sec => {
      fineSuono = sec * 1000;
      if (fineSuono + 300 > sp.durata) { clearTimeout(fine); fine = setTimeout(stop, Math.max(0, fineSuono + 300 - (Date.now() - inizio))); }
    }).catch(e => console.warn("audio", e));
  }
  document.getElementById("sceriffo").addEventListener("click", () => lanciaShow(sparaSceriffo, SUONO_SCERIFFO));
  document.getElementById("peppe").addEventListener("click", () => lanciaShow(() => peppeBrescia(IMMAGINE_PEPPE), SUONO_PEPPE));
  carica(SUONO_PEPPE).catch(() => {});
  carica(SUONO_SCERIFFO).catch(() => {});

  const griglia = document.getElementById("griglia");
  SUONI.forEach(s => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tasto";
    b.setAttribute("aria-label", s.nome);
    b.innerHTML = `<img alt="" loading="lazy"><span></span>`;
    b.querySelector("img").src = s.immagine;
    b.querySelector("span").textContent = s.nome;
    b.style.animationDelay = (griglia.children.length * 35) + "ms";
    b.addEventListener("click", () => apri(s, b));
    griglia.appendChild(b);
    carica(s.audio).catch(() => {});   // pre-carica
  });


  // Adatta la griglia: carte più grandi possibile senza dover scorrere
  function adatta() {
    const W = griglia.clientWidth, H = griglia.clientHeight, n = SUONI.length, gap = 8;
    let best = { w: 0, c: 3 };
    for (let c = 2; c <= n; c++) {
      const r = Math.ceil(n / c);
      const w = Math.min((W - gap * (c - 1)) / c, ((H - gap * (r - 1)) / r) * 0.65);
      if (w > best.w) best = { w, c };
    }
    const w = Math.floor(best.w);
    griglia.style.setProperty("--w", w + "px");
    // margini laterali così vanno a capo esattamente dopo best.c carte (l'ultima riga resta centrata)
    griglia.style.setProperty("--margine", Math.max(0, (W - (best.c * w + (best.c - 1) * gap)) / 2 - 1) + "px");
  }
  adatta();
  addEventListener("resize", adatta);
  addEventListener("orientationchange", () => setTimeout(adatta, 300));

</script>
